      <input id="passwordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Password" aria-label="Password" onkeydown="if(event.key==='Enter'){event.preventDefault();unlockExercises(event)}" required>

</div>
<script>
function unlockExercises(event){
  if(event && event.preventDefault) event.preventDefault();
  var input=document.getElementById('passwordInput');
  var gate=document.getElementById('passwordGate');
  var error=document.getElementById('passwordError');
  if(input && input.value.trim()==='367'){
    gate.hidden=true;
    gate.style.display='none';
    document.body.classList.remove('locked');
    var app=document.getElementById('app');
    if(app) app.removeAttribute('aria-hidden');
    if(error) error.textContent='';
    return false;
  }
  if(error) error.textContent='Sai mật khẩu. Vui lòng nhập lại.';
  if(input){input.value='';input.focus();}
  return false;
}
</script>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(text){
  try {
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      alert('Trình duyệt này không hỗ trợ đọc văn bản. Hãy mở file bằng Chrome hoặc Edge và kiểm tra âm lượng.'); return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(String(text));
    utterance.lang = 'en-GB'; utterance.rate = 0.82; utterance.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const british = voices.find(v => /^en-GB$/i.test(v.lang)) || voices.find(v => /^en-.*GB/i.test(v.lang));
    if (british) utterance.voice = british;
    utterance.onerror = () => { /* Browser/OS may not provide a speech voice. */ };
    window.speechSynthesis.speak(utterance);
  } catch (e) { alert('Không thể phát âm thanh. Hãy mở bằng Chrome/Edge và kiểm tra cài đặt âm thanh.'); }
}
if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }
function wordMarkup(word,ex,i,j){let under=ex.underline?.[i]?.[j]; if(!under)return esc(word);let pos=word.toLowerCase().indexOf(under.toLowerCase());if(pos<0)return esc(word);return esc(word.slice(0,pos))+'<u>'+esc(word.slice(pos,pos+under.length))+'</u>'+esc(word.slice(pos+under.length))}
function render(){let nav=document.getElementById('nav'),app=document.getElementById('app');nav.innerHTML='';app.innerHTML='';
exercises.forEach((ex,ei)=>{let b=document.createElement('button');b.textContent=ex.title.split('.')[0];b.onclick=()=>document.getElementById('ex'+ei).scrollIntoView({behavior:'smooth'});nav.appendChild(b);
let section=document.createElement('section');section.className='panel';section.id='ex'+ei;section.innerHTML='<h2>'+esc(ex.title)+'</h2>';
let questionTarget=section;
if(ex.passage){section.innerHTML+='<div class="reading-grid"><div class="reading-pane"><h3>Reading passage</h3><div class="passage">'+esc(ex.passage).replace(/\n/g,'<br>')+'</div>'+(ex.translation?'<details class="translation"><summary><b>Bản dịch tiếng Việt</b></summary>'+esc(ex.translation).replace(/\n/g,'<br>')+'</details>':'')+'</div><div class="questions-pane"><h3>Questions</h3></div></div>';questionTarget=section.querySelector('.questions-pane');}
else if(ex.translation)section.innerHTML+='<details class="translation"><summary><b>Vietnamese translation (click to show/hide)</b></summary>'+esc(ex.translation).replace(/\n/g,'<br>')+'</details>';
ex.qs.forEach((q,qi)=>{let box=document.createElement('div');box.className='q';let prompt=q[0];if(ei===0){box.innerHTML='<b>'+(qi+1)+'. '+esc(prompt)+'</b><div class="options" style="display:block">'+q[1].map((w,j)=>'<label style="display:flex;margin:6px 0"><input type="radio" name="e'+ei+'q'+qi+'" value="'+j+'"> <span>'+String.fromCharCode(65+j)+'. '+wordMarkup(w,ex,qi,j)+'</span></label>').join('')+'</div>';q[1].forEach((w,j)=>{let row=box.querySelectorAll('label')[j];let audio=document.createElement('button');audio.type='button';audio.className='sound';audio.textContent='🔊';audio.setAttribute('aria-label','Listen to '+w);audio.addEventListener('click',()=>speak(w));row.appendChild(audio)})}
else if(ex.type==='text'){box.innerHTML='<b>'+(qi+1)+'. '+esc(prompt).replace(/\n/g,'<br>')+'</b><p><input class="typed" aria-label="Your answer" style="width:100%;padding:10px;border:1px solid #b9d2dc;border-radius:8px" placeholder="Type your answer"></p><button type="button" class="btn check-one" style="margin:4px 0">Check this answer</button><div class="single-score muted"></div>'}
else {box.innerHTML='<b>'+(qi+1)+'. '+esc(prompt).replace(/\n/g,'<br>')+'</b><div class="options">'+q[1].map((opt,j)=>'<label><input type="radio" name="e'+ei+'q'+qi+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(opt)+'</label>').join('')+'</div>'}
box.innerHTML+='<div class="feedback"></div><div class="explain"></div>'; questionTarget.appendChild(box); box.querySelectorAll('input[type=radio]').forEach(inp=>inp.addEventListener('change',()=>{if(inp.checked){box.querySelectorAll('input[type=radio]').forEach(r=>{r.disabled=true;});box.classList.add('answered-locked');checkExercise(ei,section,true);}})); if(ex.type==='text'){box.querySelector('.check-one').addEventListener('click',()=>checkSingleQuestion(ei,section,qi)); box.querySelector('.typed').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();checkSingleQuestion(ei,section,qi)}});}});let check=document.createElement('button');check.className='btn';check.textContent=ex.type==='text'?'Check all answers':'Check answers';check.onclick=()=>checkExercise(ei,section);section.appendChild(check);let score=document.createElement('div');score.className='score';score.style.marginTop='10px';score.textContent='Score: not checked yet';section.appendChild(score);app.appendChild(section)});
}
function norm(s){return s.toLowerCase().trim().replace(/[’']/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function checkSingleQuestion(ei,section,qi){
let ex=exercises[ei],box=section.querySelectorAll('.q')[qi],q=ex.qs[qi],user=box.querySelector('.typed').value.trim();
let fb=box.querySelector('.feedback'),explain=box.querySelector('.explain'),mini=box.querySelector('.single-score');
if(!user){fb.className='feedback wrong';fb.textContent='Hãy nhập câu trả lời trước khi chấm.';explain.style.display='none';mini.textContent='Chưa chấm';return;}
let answer=q[1],acceptable=answer.split('/').map(x=>norm(x)),ok=acceptable.some(a=>norm(user)===a);
if(ei===6)ok=norm(user)===norm(answer);
fb.className='feedback '+(ok?'correct':'wrong');
fb.textContent=ok?'Đúng rồi! ✓':'Chưa chính xác. Đáp án gợi ý: '+answer;
let extra=vnSupport[ei]?.[qi]||['Nghĩa tiếng Việt: '+q[0],'Hãy chú ý trật tự từ, thì của động từ và cấu trúc so sánh trong câu.'];
explain.style.display='block';
explain.innerHTML='<b>Dịch nghĩa:</b> '+esc(extra[0])+'<br><br><b>Giải thích:</b> '+esc(extra[1])+'<br><br><b>Đáp án gợi ý:</b> '+esc(answer);
mini.textContent=ok?'Kết quả câu này: 1/1':'Kết quả câu này: 0/1';
/* Update the exercise score using only text answers that have been individually checked or entered. */
let boxes=[...section.querySelectorAll('.q')],correct=0,answered=0;
boxes.forEach((b,i)=>{let val=b.querySelector('.typed')?.value.trim();if(!val)return;answered++;let a=ex.qs[i][1],acc=a.split('/').map(x=>norm(x));let right=acc.some(x=>norm(val)===x);if(ei===6)right=norm(val)===norm(a);if(right)correct++;});
section.querySelector('.score').textContent='Điểm hiện tại: '+correct+' / '+answered+' câu đã nhập';
document.getElementById('totalScore').textContent='Bài tự luận đang chấm từng câu riêng; điểm được cập nhật khi bạn bấm “Check this answer”.';
}
function checkExercise(ei,section,live=false){let ex=exercises[ei],boxes=[...section.querySelectorAll('.q')],correct=0,answered=0;
boxes.forEach((box,qi)=>{let q=ex.qs[qi],user='',ok=false,answer='',isAnswered=false;
if(ex.type==='text'){user=box.querySelector('.typed').value;isAnswered=!!user.trim();answer=q[1];let acceptable=answer.split('/').map(x=>norm(x));ok=acceptable.some(a=>norm(user)===a);if(ei===6){ok=norm(user)===norm(answer)}}
else {let selected=box.querySelector('input[type=radio]:checked');if(selected){user=selected.value;isAnswered=true;ok=Number(user)===q[2];}answer=ex.type==='mc'?q[1][q[2]]:'';}
let fb=box.querySelector('.feedback'),explain=box.querySelector('.explain');
if(!isAnswered){fb.className='feedback';fb.textContent='';explain.style.display='none';return;}
answered++;if(ok)correct++;fb.className='feedback '+(ok?'correct':'wrong');fb.textContent=ok?'Đúng rồi! ✓':'Chưa đúng. Đáp án: '+(ex.type==='text'?q[1]:String.fromCharCode(65+q[2])+'. '+answer);
let extra=vnSupport[ei]?.[qi]||['Nghĩa tiếng Việt: '+(q[0]||''),'Hãy đối chiếu nghĩa của câu, từ vựng và cấu trúc ngữ pháp để chọn đáp án.'];
let translation=extra[0], explanation=extra[1];
if(ei===0){translation='Yêu cầu: '+q[0];}
explain.style.display='block';explain.innerHTML='<b>Dịch nghĩa:</b> '+esc(translation)+'\n\n<b>Giải thích:</b> '+esc(explanation)+'\n\n<b>Đáp án đúng:</b> '+esc(ex.type==='text'?q[1]:String.fromCharCode(65+q[2])+'. '+answer);
});
let score=section.querySelector('.score');score.textContent=live?'Kết quả hiện tại: '+correct+' / '+answered+' câu đã chọn':'Điểm: '+correct+' / '+ex.qs.length+' ('+Math.round(correct/ex.qs.length*100)+'%)';
document.getElementById('totalScore').textContent='Đã làm: '+[...document.querySelectorAll('#app section')].filter(s=>s.querySelector('.score').textContent.includes('/')&&!s.querySelector('.score').textContent.includes('not checked')).length+' / '+exercises.length+' phần (điểm từng phần được tính riêng).';
}
render();
</script>
